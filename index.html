<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>မိုးကောင်းကျော်</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            background: #ffd6e7;

            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            width: 100%;
        }

        h1 {
            color: #ff4f81;
            font-size: 38px;

            margin-bottom: 50px;
        }

        .buttons {
            position: relative;

            width: 500px;
            height: 250px;

            margin: auto;
        }

        button {
            position: absolute;

            border: none;
            border-radius: 40px;

            padding: 18px 30px;

            font-size: 20px;

            cursor: pointer;

            transition: all 0.3s ease;
        }

        #yes {
            left: 40px;
            top: 70px;

            background: #ff6b91;
            color: white;

            z-index: 10;
        }

        #no {
            right: 40px;
            top: 70px;

            background: #bdefff;
            color: #333;

            z-index: 20;
        }

        #message {
            display: none;

            font-size: 35px;
            color: #ff4f81;

            padding: 30px;
        }

    </style>
</head>


<body>

    <div class="container">

        <h1 id="question">
            မိုးကောင်းကျော် ရူးနေတာလား? 😂
        </h1>


        <div class="buttons">

            <button id="yes" onclick="yesClicked()">
                ဟုတ်တယ် ရူးနေတာ 😂
            </button>


            <button id="no" onclick="noClicked()">
                မရူးဘူး 😎
            </button>

        </div>


        <div id="message">
            ငါထင်တယ်ကွာ အတန်းထဲမှာ $ပေါလုပ်နေကထဲက
            ရူးနေတယ်လိုထင်လိုက်တယ် 😂
        </div>

    </div>


    <script>

        let yesSize = 1;

        let noCount = 0;


        function noClicked() {

            noCount++;


            // ဟုတ်တယ် ရူးနေတာ button ကိုကြီးအောင်လုပ်

            yesSize += 0.35;

            document.getElementById("yes").style.transform =
                `scale(${yesSize})`;


            // မရူးဘူး button ကို random နေရာရွှေ့

            let no = document.getElementById("no");

            let maxX = window.innerWidth - 150;
            let maxY = window.innerHeight - 100;

            let randomX = Math.random() * maxX;
            let randomY = Math.random() * maxY;


            no.style.position = "fixed";

            no.style.left = randomX + "px";
            no.style.top = randomY + "px";


            // အရမ်းကြီးလာရင် YES ကို screen ပြည့်အောင်လုပ်

            if (yesSize >= 5) {

                document.getElementById("yes").style.position =
                    "fixed";

                document.getElementById("yes").style.left =
                    "0";

                document.getElementById("yes").style.top =
                    "0";

                document.getElementById("yes").style.width =
                    "100vw";

                document.getElementById("yes").style.height =
                    "100vh";

                document.getElementById("yes").style.borderRadius =
                    "0";

                document.getElementById("yes").style.fontSize =
                    "50px";

                document.getElementById("no").style.display =
                    "none";
            }

        }


        function yesClicked() {

            document.getElementById("question").style.display =
                "none";

            document.querySelector(".buttons").style.display =
                "none";

            document.getElementById("message").style.display =
                "block";

        }

    </script>

</body>
</html>
